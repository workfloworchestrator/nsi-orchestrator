[project]
name = "nsi-orchestrator"
version = "0.1.1.dev1"
description = "NSI WFO implentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    # git ref: callback_step timeout (orchestrator-core#1744) and cron schedule parsing fix
    # (orchestrator-core#1755) are not in a release yet; pin the version once a 5.1.x is published.
    "orchestrator-core @ git+https://github.com/workfloworchestrator/orchestrator-core.git@e6c20302873edaf8a444a308ab84e90d6ad3b018",
    "pydantic-settings==2.14.2",
    "python-statemachine==3.2.0",
]

[project.scripts]
nsi-orchestrator = "main:init_cli_app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["auth", "log_filters", "main", "settings", "wsgi"]

[tool.setuptools.packages.find]
include = ["products*", "workflows*", "services*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest==9.1.0",
    "ruff==0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["migrations"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs= true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = [
    '^build/',
    '^\.venv/',
    '^migrations/',  # generated alembic scripts; also excluded from ruff
]

[[tool.mypy.overrides]]
module = [
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
