[project]
name = "nsi-orchestrator"
dynamic = ["version"]
description = "NSI WFO implentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx2==2.12.0",
    "oauth2-lib==3.0.1",
    "orchestrator-core==5.3.0",
    "pydantic-settings==2.15.0",
    "python-statemachine==3.2.1",
]

[project.scripts]
nsi-orchestrator = "main:init_cli_app"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools]
py-modules = ["auth", "log_filters", "main", "schedules", "settings", "wsgi"]

[tool.setuptools.packages.find]
include = ["products*", "workflows*", "services*"]

[tool.uv]
package = true
# litellm 1.92+ ships only manylinux and win_amd64 wheels; on musl and macOS it falls back to an
# sdist that needs a Rust toolchain.
constraint-dependencies = ["litellm<1.92"]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Pydantic form/domain models declare fields as class attributes; a literal [] default is a field
# default, not shared mutable class state.
ignore = ["RUF012"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = true
disallow_incomplete_defs= true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = [
    '^build/',
    '^\.venv/',
    '^migrations/',  # generated alembic scripts; also excluded from ruff
]

[[tool.mypy.overrides]]
module = [
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
